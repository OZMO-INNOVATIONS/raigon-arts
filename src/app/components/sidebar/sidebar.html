<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">

    <div class="brand-logo">
      <div class="brand-icon">
        <i class="fa-solid fa-image"></i>
      </div>

      <div class="brand-text">
        <span class="brand-title">RAIGON ARTS</span>
        <span class="brand-subtitle">PHOTO FRAMES</span>
      </div>
    </div>

    <button
      class="sidebar-toggle-btn"
      title="Toggle Sidebar"
      (click)="toggleSidebar()">

      <i class="fa-solid fa-bars"></i>

    </button>

  </div>


  <nav class="sidebar-nav">

    <!-- Dashboard -->
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item">

      <i class="fa-solid fa-gauge-high"></i>
      <span class="nav-text">Dashboard</span>

    </a>


    <!-- Customers -->
    <a
      routerLink="/customers"
      routerLinkActive="active"
      class="nav-item">

      <i class="fa-solid fa-user-group"></i>
      <span class="nav-text">Customers</span>

      <span class="nav-badge">HERO</span>

    </a>


    <!-- New Order -->
    <a
      href="javascript:void(0)"
      class="nav-item"
      (click)="openNewOrder()">

      <i class="fa-solid fa-circle-plus"></i>
      <span class="nav-text">New Order</span>

    </a>

    <!-- Orders -->
    <a
      routerLink="/orders"
      routerLinkActive="active"
      class="nav-item">

      <i class="fa-solid fa-box-archive"></i>
      <span class="nav-text">Orders</span>

    </a>


    <!-- Photo Collection -->
    <a
      routerLink="/photos"
      routerLinkActive="active"
      class="nav-item">

      <i class="fa-solid fa-images"></i>
      <span class="nav-text">Photo Collection</span>

    </a>


    <!-- Frame Sizes -->
    <a
      routerLink="/frames"
      routerLinkActive="active"
      class="nav-item">

      <i class="fa-solid fa-ruler-combined"></i>
      <span class="nav-text">Frame Sizes</span>

    </a>


    <!-- Categories -->
    <a
      routerLink="/categories"
      routerLinkActive="active"
      class="nav-item">

      <i class="fa-solid fa-layer-group"></i>
      <span class="nav-text">Categories</span>

    </a>


    <!-- Reports -->
    <a
      routerLink="/reports"
      routerLinkActive="active"
      class="nav-item">

      <i class="fa-solid fa-chart-column"></i>
      <span class="nav-text">Reports</span>

    </a>


    <!-- Settings -->
    <a
      routerLink="/settings"
      routerLinkActive="active"
      class="nav-item">

      <i class="fa-solid fa-sliders"></i>
      <span class="nav-text">Settings</span>

    </a>

  </nav>


  <div class="sidebar-footer">

    <div class="user-sidebar-card">

      <div class="user-avatar">
        RA
      </div>

      <div class="user-details">

        <div class="user-name">
          Raigon Manager
        </div>

        <div class="user-role">
          Master Workshop
        </div>

      </div>

      <button
        class="logout-btn"
        title="Logout"
        (click)="logout()">

        <i class="fa-solid fa-power-off"></i>

      </button>

    </div>

  </div>

</aside>
